name: romasubai_frontend
description: "RomaSub.AI - Roman Urdu Caption Generator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.4.0

  # File Operations
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Google OAuth
  google_sign_in: ^6.2.1

  # URL launcher (for opening browser in OAuth flow)
  url_launcher: ^6.2.5

  # Local HTTP server (for OAuth callback)
  shelf: ^1.4.1

  # Window management (bring app to foreground after OAuth)
  window_manager: ^0.3.9

  # Utilities
  intl: ^0.19.0
  mime: ^1.0.4

  # OTP Input
  pinput: ^3.0.1

  # Image Picker
  image_picker: ^1.0.7

  # Video Player (desktop + mobile support)
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_macos_video: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
