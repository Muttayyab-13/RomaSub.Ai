name: romasubai_frontend
description: "RomaSub.AI - Roman Urdu Caption Generator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.4.0

  # File Operations
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Google OAuth
  google_sign_in: ^6.2.1

  # Utilities
  intl: ^0.19.0
  mime: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logos/
